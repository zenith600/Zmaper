<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob:; media-src 'self' file: data: blob:;" />
    <title>Zmaper - Output</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        cursor: none;
      }
      #stage { display: block; width: 100%; height: 100%; }
      #hint {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font: 500 15px/1.6 system-ui, sans-serif;
        color: #8a8f99;
        text-align: center;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }
      #hint.hidden { opacity: 0; }
      #hint kbd {
        background: #1c1e22;
        border: 1px solid #33363d;
        border-radius: 4px;
        padding: 2px 7px;
        color: #d6d9e0;
        font-family: inherit;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="hint">Zmaper output<br />Press <kbd>Esc</kbd> to close this window</div>
    <script type="module" src="output.js"></script>
  </body>
</html>
